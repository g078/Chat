<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chat</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; }
  body { background: #EAEDED; display: flex; flex-direction: column; height: 100dvh; }
  .header { background: #075E54; color: #fff; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .header b { font-size: 19px; }
  .header small { font-size: 11px; opacity: 0.8; display: block; }
  .header button { background: #25D366; border: none; color: #fff; font-weight: 700; padding: 8px 12px; border-radius: 20px; font-size: 13px; }
  .header-right { display: flex; gap: 6px; align-items: center; }
  .header-right .bell { background: #fff; color: #111; padding: 8px 10px; }
  .header-right .bell.on { background: #FFD93D; }
  .room { background: #fff; padding: 8px; display: flex; gap: 8px; flex-shrink: 0; border-bottom: 1px solid #ddd; }
  .room input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px; background: #F2F2F2; }
  .room button { background: #075E54; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: 700; }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
  .msg { max-width: 82%; padding: 8px 11px; border-radius: 10px; font-size: 15px; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
  .me { align-self: flex-end; background: #DCF8C6; border-top-right-radius: 2px; }
  .other { align-self: flex-start; background: #fff; border-top-left-radius: 2px; }
  .msg img, .msg video { width: 100%; max-width: 230px; border-radius: 8px; display: block; margin-top: 4px; }
  .msg audio { width: 100%; max-width: 220px; margin-top: 4px; }
  .msg small { display: block; font-size: 10px; color: #888; text-align: right; margin-top: 3px; }
  .send { background: #fff; padding: 8px; display: flex; gap: 6px; align-items: center; flex-shrink: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .send input[type=text] { flex: 1; padding: 11px 14px; border: none; background: #F2F2F2; border-radius: 25px; outline: none; font-size: 15px; min-width: 0; }
  .ic { width: 42px; height: 42px; border: none; border-radius: 50%; background: #F2F2F2; font-size: 19px; flex-shrink: 0; }
  .ic.rec { background: #FF3B30; color: #fff; }
  .sendBtn { width: 46px; height: 46px; border: none; border-radius: 50%; background: #25D366; color: #fff; font-size: 18px; flex-shrink: 0; }
  /* Video Call */
  #callBox { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; }
  #callBox.show { display: flex; }
  #remoteVideo { flex: 1; width: 100%; background: #111; object-fit: cover; }
  #localVideo { position: absolute; top: 12px; right: 12px; width: 110px; height: 150px; border-radius: 10px; border: 2px solid #fff; object-fit: cover; background: #222; }
  #callBar { padding: 14px; display: flex; justify-content: center; gap: 12px; background: #111; }
  #callBar button { width: 58px; height: 58px; border-radius: 50%; border: none; font-size: 22px; }
  .endCall { background: #FF3B30 !important; color: #fff; }
  .empty { text-align: center; color: #888; font-size: 13px; padding: 20px; }
</style>
</head>
<body>

<div class="header">
  <div><b>Chat</b><small id="statusText">Offline • Room connect karo</small></div>
  <div class="header-right">
    <button class="bell" id="bellBtn" onclick="askNotify()">🔔</button>
    <button onclick="startCall()">📹 Video Call</button>
  </div>
</div>

<div class="room">
  <input type="text" id="roomCode" placeholder="Room code" value="xyz">
  <button onclick="joinRoom()">Connect</button>
</div>

<div class="chat" id="chatBox"><div class="empty">Room connect karo, saare purane message yahi dikhenge</div></div>

<div class="send">
  <button class="ic" onclick="document.getElementById('photoInput').click()">📷</button>
  <button class="ic" onclick="document.getElementById('videoInput').click()">🎬</button>
  <input type="text" id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
  <button class="ic" id="voiceBtn" onclick="toggleVoice()">🎤</button>
  <button class="sendBtn" onclick="sendMsg()">➤</button>
</div>

<input type="file" id="photoInput" accept="image/*" hidden onchange="sendPhoto(this)">
<input type="file" id="videoInput" accept="video/*" hidden onchange="sendVideo(this)">

<!-- VIDEO CALL SCREEN -->
<div id="callBox">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div id="callBar">
    <button onclick="toggleMic()" id="micBtn">🎙</button>
    <button onclick="toggleCam()" id="camBtn">📷</button>
    <button class="endCall" onclick="endCall()">📞</button>
  </div>
</div>

<script>
  let client = null, baseTopic = "", currentRoom = "";
  let myId = localStorage.getItem('tadka_myid');
  if(!myId){ myId = "u_" + Math.floor(Math.random()*1000000) + "_" + Date.now(); localStorage.setItem('tadka_myid', myId); }
  let mediaRecorder = null, audioChunks = [], isRecording = false;
  let saved = [], seen = new Set();
  let pc = null, localStream = null, micOn = true, camOn = true;
  let unreadCount = 0;

  function timeNow(){ return new Date().toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'}); }
  function setStatus(t){ document.getElementById('statusText').textContent = t; }

  // --- NOTIFICATION : Jab chat khula hoga tabhi aayega ---
  function askNotify(){
    if(!("Notification" in window)) return alert("Is browser me notification nahi chalega");
    Notification.requestPermission().then(p=>{
      if(p==="granted"){ document.getElementById('bellBtn').classList.add('on'); try{ new Notification("Chat",{body:"Notification ON ho gaya! Chat khula rahega tab message aayega."}); }catch(e){} }
      else alert("Allow dabao");
    });
  }
  function playBeep(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 250);
    }catch(e){}
  }
  function notifyNew(data){
    playBeep();
    if(navigator.vibrate) navigator.vibrate([120,60,120]);
    unreadCount++;
    document.title = "🔴 ("+unreadCount+") Naya Message • Chat";
    const text = data.type==='text' ? data.text : (data.type==='photo' ? "📷 Photo aayi hai" : data.type==='video' ? "🎬 Video aaya hai" : "🎤 Voice aaya hai");
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification("Chat - #"+currentRoom, {body: text}); }catch(e){}
    }
  }
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ unreadCount=0; document.title="Chat"; } });
  document.getElementById('msgInput').addEventListener('focus', ()=>{ unreadCount=0; document.title="Chat"; });
  if("Notification" in window && Notification.permission==="granted") document.getElementById('bellBtn').classList.add('on');

  function joinRoom(){
    const code = document.getElementById('roomCode').value.trim();
    if(!code) return alert("Room code daalo");
    if(client){ try{client.end(true);}catch(e){} }
    currentRoom = code; baseTopic = "tadka_final_" + code;
    saved = []; seen = new Set();
    try{ saved = JSON.parse(localStorage.getItem('tadka_'+code)||'[]'); }catch(e){ saved=[]; }
    seen = new Set(saved.map(m=>m.id));
    const box = document.getElementById('chatBox'); box.innerHTML = "";
    if(saved.length) saved.forEach(m=>showMsg(m, m.sender===myId));
    else box.innerHTML = '<div class="empty">Naya room hai</div>';
    setStatus("Connecting...");
    // Pehli baar Connect pe notification permission maango - taaki khula hone pe pata chale
    if("Notification" in window && Notification.permission==="default"){ Notification.requestPermission().then(p=>{ if(p==="granted") document.getElementById('bellBtn').classList.add('on'); }); }
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    client.on('connect', ()=>{
      client.subscribe(baseTopic + "/msg/#");
      client.subscribe(baseTopic + "/signal");
      setStatus("Online • Room: " + code);
    });
    client.on('message', (topic, message)=>{
      try{
        if(topic.endsWith("/signal")){ handleSignal(JSON.parse(message.toString())); return; }
        const data = JSON.parse(message.toString());
        if(data.sender===myId) return;
        if(seen.has(data.id)) return;
        seen.add(data.id); save(data); showMsg(data,false);
        notifyNew(data);
      }catch(e){}
    });
  }

  // --- NO LIMIT : Kabhi delete nahi hoga, 100 / 1000 / 10000 sab rahenge ---
  function save(d){
    saved.push(d);
    saved.sort((a,b)=>a.ts-b.ts);
    // NO slice(-100) - purana message kabhi nahi katega
    try{
      localStorage.setItem('tadka_'+currentRoom, JSON.stringify(saved));
    }catch(e){
      // Phone memory full ho jaye to bhi message delete nahi karenge.
      // Sirf purani photo/video ka data halka karenge, TEXT hamesha rahega.
      try{
        for(let i=0;i<saved.length;i++){
          if(saved[i].type==='photo' || saved[i].type==='video' || saved[i].type==='voice'){
            saved[i].text = "[purana media - memory full]";
            saved[i].type = 'text';
            try{ localStorage.setItem('tadka_'+currentRoom, JSON.stringify(saved)); break; }catch(e2){ continue; }
          }
        }
      }catch(e2){}
    }
  }

  function showMsg(data,isMe){
    const box = document.getElementById('chatBox');
    if(box.querySelector('.empty')) box.innerHTML="";
    const d = document.createElement('div'); d.className='msg '+(isMe?'me':'other');
    if(data.type==='photo'){ const img=document.createElement('img'); img.src=data.text; d.appendChild(img); }
    else if(data.type==='video'){ const v=document.createElement('video'); v.src=data.text; v.controls=true; v.playsInline=true; d.appendChild(v); }
    else if(data.type==='voice'){ const a=document.createElement('audio'); a.src=data.text; a.controls=true; d.appendChild(a); }
    else d.textContent=data.text;
    const s=document.createElement('small'); s.textContent=data.time||timeNow(); d.appendChild(s);
    box.appendChild(d); box.scrollTop=box.scrollHeight;
  }
  function sendPayload(type,text){
    if(!client||!client.connected) return alert("Pehle Connect dabao!");
    const data={ id: Date.now()+"_"+myId+"_"+Math.floor(Math.random()*99999), sender:myId, type:type, text:text, time:timeNow(), ts:Date.now() };
    const str = JSON.stringify(data);
    // Photo bada ho to bhi MQTT limit me rahe, isliye photo pehle se chhota karke bhejte hai
    if(str.length > 220000) return alert("Ye photo/video bahut bada hai, thodi chhoti photo bhejo");
    client.publish(baseTopic+"/msg/"+data.id, str, {retain:true, qos:1});
    seen.add(data.id); save(data); showMsg(data,true);
  }
  function sendMsg(){ const i=document.getElementById('msgInput'); const t=i.value.trim(); if(!t) return; sendPayload('text',t); i.value=""; }

  // --- PHOTO FIX : Badi photo ab nahi atkegi, har size ki photo jayegi ---
  function sendPhoto(inp){
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        // Badi photo ko step-by-step chhota karo jab tak 180KB ke andar na aa jaye
        let w=img.width, h=img.height;
        let maxW = 800, quality = 0.65;
        function tryCompress(){
          let nw=w, nh=h;
          if(nw>maxW){ nh=nh*maxW/nw; nw=maxW; }
          const c=document.createElement('canvas'); c.width=nw; c.height=nh;
          c.getContext('2d').drawImage(img,0,0,nw,nh);
          const url = c.toDataURL('image/jpeg', quality);
          // Agar abhi bhi bada hai to aur chhota karo, phir bhejo
          if(url.length > 180000 && (maxW>300 || quality>0.25)){
            if(quality>0.3) quality -= 0.15;
            else maxW = Math.floor(maxW*0.7);
            tryCompress();
          } else {
            sendPayload('photo', url);
          }
        }
        tryCompress();
      };
      img.onerror=()=>alert("Ye photo khul nahi rahi, dusri photo try karo");
      img.src=e.target.result;
    };
    r.readAsDataURL(f); inp.value="";
  }
  function sendVideo(inp){ const f=inp.files[0]; if(!f) return; if(f.size>900000) return alert("Video bada hai, 8-10 sec ka bhejo"); const r=new FileReader(); r.onload=(e)=>sendPayload('video',e.target.result); r.readAsDataURL(f); inp.value=""; }
  async function toggleVoice(){
    const btn=document.getElementById('voiceBtn');
    if(!isRecording){
      if(!client||!client.connected) return alert("Pehle Connect dabao!");
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRecorder=new MediaRecorder(stream); audioChunks=[];
        mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
        mediaRecorder.onstop=()=>{ const blob=new Blob(audioChunks,{type:'audio/webm'}); const r=new FileReader(); r.onload=(e)=>sendPayload('voice',e.target.result); r.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop()); };
        mediaRecorder.start(); isRecording=true; btn.classList.add('rec'); btn.textContent="⏹️";
      }catch(e){ alert("Mic Allow karo"); }
    } else { mediaRecorder.stop(); isRecording=false; btn.classList.remove('rec'); btn.textContent="🎤"; }
  }

  // ===== VIDEO CALL - WebRTC via MQTT Signal =====
  function sendSignal(obj){ if(!client||!client.connected) return alert("Pehle Connect dabao!"); obj.from=myId; client.publish(baseTopic+"/signal", JSON.stringify(obj)); }
  async function startCall(){
    if(!client||!client.connected) return alert("Pehle Connect dabao!");
    document.getElementById('callBox').classList.add('show');
    await setupPC();
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    sendSignal({type:'offer', sdp: offer});
  }
  async function setupPC(){
    if(pc) return;
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    document.getElementById('localVideo').srcObject = localStream;
    pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
    pc.ontrack = (e)=>{ document.getElementById('remoteVideo').srcObject = e.streams[0]; };
    pc.onicecandidate = (e)=>{ if(e.candidate) sendSignal({type:'ice', candidate:e.candidate}); };
  }
  async function handleSignal(d){
    if(d.from===myId) return;
    if(d.type==='offer'){
      const ok = confirm("Video Call aa raha hai, Accept karu?");
      if(!ok) return;
      document.getElementById('callBox').classList.add('show');
      await setupPC();
      await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      sendSignal({type:'answer', sdp: ans});
    } else if(d.type==='answer'){
      if(pc) await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
    } else if(d.type==='ice'){
      if(pc) try{ await pc.addIceCandidate(new RTCIceCandidate(d.candidate)); }catch(e){}
    } else if(d.type==='end'){ endCall(true); }
  }
  function toggleMic(){ micOn=!micOn; if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=micOn); document.getElementById('micBtn').textContent=micOn?'🎤':'🔇'; }
  function toggleCam(){ camOn=!camOn; if(localStream) localStream.getVideoTracks().forEach(t=>t.enabled=camOn); document.getElementById('camBtn').textContent=camOn?'📷':'🚫'; }
  function endCall(silent){
    if(!silent) sendSignal({type:'end'});
    document.getElementById('callBox').classList.remove('show');
    if(pc){ try{pc.close();}catch(e){} pc=null; }
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    document.getElementById('remoteVideo').srcObject=null; document.getElementById('localVideo').srcObject=null;
  }
</script>
</body>
</html>
